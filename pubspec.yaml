name: crpto
description: "Simple description."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  package_info_plus: ^9.0.0
  riverpod_annotation: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  custom_refresh_indicator: ^4.0.1
  flutter_auto_size_text: ^4.1.0
  carousel_slider: ^5.1.1
  flutter_dotenv: ^6.0.0
  sliver_tools: ^0.2.12
  equatable: ^2.0.8
  decimal: ^3.2.4
  rxdart: ^0.28.0
  intl: ^0.20.2
  cron: ^0.6.2
  uuid: ^4.5.2

  # state management
  flutter_riverpod: ^3.0.3
  provider: ^6.1.5+1

  # routing
  go_router: ^17.0.1

  # network
  web_socket_channel: ^3.0.3
  dio: ^5.9.0

  # graphics
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.19
  cached_network_image: ^3.4.1
  fl_chart: ^1.1.1
  shimmer: ^3.0.0

  # local storage
  shared_preferences: ^2.5.4
  drift_flutter: ^0.2.8
  drift: ^2.30.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.30.0

  riverpod_generator: ^3.0.3

  riverpod_lint: ^3.0.3
  custom_lint: ^0.8.1

  vector_graphics_compiler: ^1.1.19

  build_runner: ^2.10.4

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/svgs/
    - assets/svgs_vec/
    - assets/svgs/common/
    - assets/svgs/tokens/
    - assets/svgs/tokens/
    - assets/svgs_vec/tokens/
    - assets/svgs_vec/tokens/

    - .env
    - .env-dev